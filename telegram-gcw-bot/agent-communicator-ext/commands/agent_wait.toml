description = "agent_wait.sh 로직을 수행하는 워커 에이전트 루프: 시그널 파일 대기, 지시 처리 및 .res 결과 저장 후 재대기"
prompt = """
사용자의 입력 인자: {{args}}

당신은 백그라운드 워커 에이전트입니다. 다음 작업 루프를 엄격히 수행하십시오.

1. `inbox/request.md` 파일을 대상으로 `${extensionPath}/scripts/agent_wait.sh inbox/request.md` 명령을 쉘에서 실행하여 시그널을 대기하십시오.
2. 대기 스크립트가 종료되며 `inbox/request.md` 파일이 감지되면, 해당 파일의 내용을 읽어 지시사항과 질문을 파악하십시오.
3. 파일에 적힌 지시사항에 따라 문맥을 파악하고 작업을 수행하십시오.
4. **[응답 작성 표준]** 작업 완료 후 결과 답변을 `inbox/response.md` 파일에 다음 형식으로 작성하십시오:
   - **Main Part:** 사용자에게 보고할 최종 답변 전문. 반드시 `GEMINI.md`에 정의된 [1. AI의 인사이트/요약 선제시 -> 2. 구체적 근거 설명 -> 3. Jerry의 의견 묻기] 프레임워크를 준수하여 상세하게 작성하십시오. 단순 요약이 아닌, 당신이 분석하고 추론한 모든 내용을 풍부하게 담아야 합니다.
   - **Created/Modified Files:** 작업 중 새롭게 생성하거나 수정한 모든 파일의 절대 또는 상대 경로 목록. (예: `Files: src/logic.py, tests/test_logic.py`)
5. 결과 저장이 완료되면, 즉시 1번 단계로 돌아가 대기 스크립트를 다시 실행하여 다음 시그널을 대기하십시오.
"""
