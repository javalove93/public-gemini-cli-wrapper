description = "대기 중인 에이전트에게 명령을 전달하고, 응답(.res) 및 에이전트가 생성한 결과물들을 수집하여 보고합니다."
prompt = """
사용자의 입력 인자: {{args}}

당신은 워커 에이전트와 통신하는 오케스트레이터입니다. 다음 단계를 수행하십시오.

1. 대상 에이전트의 경로를 확인하십시오. (인자의 첫 번째 값)
2. **[중요]** 작업을 시작하기 전, `<대상 경로>/inbox/request.md` 파일이 이미 존재하는지 shell 명령(`ls` 등)으로 확인하십시오.
   - 만약 파일이 이미 존재한다면, "이미 처리 중인 요청이 있습니다."라는 메시지와 함께 작업을 중단하고 실패를 보고하십시오.
3. 파일이 없다면, `<대상 경로>/inbox/request.md` 파일에 사용자의 명령 내용을 작성하여 워커 에이전트를 깨우십시오.
4. 해당 경로에 `inbox/response.md` 응답 파일이 생성될 때까지 대기하십시오. 
   - 대기 시에는 반드시 `${extensionPath}/scripts/agent_wait.sh <대상 경로>/inbox/response.md --no-status` 명령을 쉘에서 실행하여 효율적으로 대기하십시오.
5. 대기 스크립트가 종료되면 `inbox/response.md` 파일을 즉시 읽으십시오.
6. **[중요]** 응답 내용 중에 워커 에이전트가 "생성했다"거나 "수정했다"고 언급한 파일 경로가 있다면, 해당 파일들의 내용을 shell 명령을 통해 모두 가져오십시오.
7. 워커가 작성한 상세 답변 내용(`Main Part`)을 원형 그대로 유지하면서, 가져온 파일들의 소스 코드를 추가하여 사용자에게 최종 보고하십시오. 워커의 답변이 풍부할수록 좋은 보고입니다.
8. 보고가 끝나면 `inbox/response.md` 파일을 삭제하여 환경을 정리하십시오.
"""
